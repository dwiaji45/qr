<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR GENERATORKU</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://lh3.googleusercontent.com/d/1RJkvv-OsdOchFl2L-oimzZpHAOzoPAZr">
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    
    <style>
        /* CSS Reset & Dasar */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f3f6f9; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        /* Desain Card Utama */
        .card { 
            background: #ffffff; 
            padding: 46px 34px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(14, 88, 166, 0.35); 
            width: 100%;
            max-width: 640px;
            text-align: center;
        }
        
        .card h2 {
            font-weight: 600;
            font-size: 26px;
            margin-bottom: 16px;
            color: #0E58A6;
        }

        /* Desain Input & Baris Input */
        .input-group { 
            margin-bottom: 16px; 
            text-align: left;
        }
        .input-group label {
            display: block;
            font-weight: 500;
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
        }
        
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input[type="text"] {
            flex: 1;
        }

        input[type="text"] { 
            width: 100%; 
            padding: 12px 16px; 
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            transition: all 0.3s ease;
            outline: none;
            background-color: #fafbfc;
        }
        input[type="text"]:focus {
            border-color: #0e58a6;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(14, 88, 166, 0.15);
        }

        /* Input File Khusus Logo */
        .file-input {
            width: 100%;
            padding: 10px;
            font-size: 13px;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            background-color: #fafbfc;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }
        .file-input:hover {
            border-color: #0e58a6;
        }
        .file-help {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: #64748b;
        }

        /* Desain Tombol Ikon */
        .icon-btn {
            background-color: #fafbfc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            min-width: 48px;
        }
        .icon-btn:hover {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
        }
        .icon-btn:active {
            transform: scale(0.95);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: #475569;
        }
        
        /* Tombol Buat QR */
        #btn-buat { 
            background-color: #0e58a6;
            color: #ffffff; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            width: 100%;
            margin-top: 8px;
            transition: all 0.3s ease;
        }
        #btn-buat:hover { 
            background-color: #0a427c; 
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 88, 166, 0.2);
        }

        /* Wadah Hasil Canvas */
        #canvas-container { 
            margin-top: 24px; 
            padding: 16px; 
            background: #f8fafc; 
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
            display: none; 
            animation: fadeIn 0.5s ease-in-out;
        }
        canvas { 
            max-width: 100%; 
            height: auto;
            border-radius: 8px;
        }

        /* Grup Tombol Unduh */
        .btn-group {
            display: none;
            gap: 12px;
            margin-top: 16px;
            animation: fadeIn 0.5s ease-in-out;
            flex-wrap: wrap;
        }
        .btn-group select {
            flex: 1;
            min-width: 120px;
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #e2e8f0; 
            outline: none; 
            font-family: 'Inter', sans-serif;
        }

        .btn-outline {
            flex: 1; 
            background-color: transparent; 
            color: #0e58a6; 
            padding: 12px; 
            border: 2px solid #0e58a6; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            min-width: 100px;
        }
        .btn-outline:hover { 
            background-color: #0e58a6; 
            color: #ffffff;
        }

        /* Toast Notification */
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #334155;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 14px 20px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.15);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s, visibility 0.3s;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        /* Animasi Muncul & Responsivitas HP */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .card { padding: 24px 20px; }
            .card h2 { font-size: 22px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2><strong>BUAT QR</strong></h2>
        
        <div class="input-group">
            <label>Teks atau URL Tujuan</label>
            <div class="input-row">
                <input type="text" id="input-teks" placeholder="Masukkan link atau teks...">
                
                <button class="icon-btn" id="btn-shorten" onclick="shortenUrl()" title="Perpendek URL" aria-label="Perpendek URL">
                    <svg viewBox="0 0 24 24">
                        <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
                    </svg>
                </button>
                
                <button class="icon-btn" id="btn-copy" onclick="copyText()" title="Salin Teks/URL" aria-label="Salin Teks atau URL">
                    <svg viewBox="0 0 24 24">
                        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <div class="input-group">
            <label>Judul File QR Code</label>
            <input type="text" id="input-judul" placeholder="Contoh: Website Perusahaan">
        </div>

        <div class="input-group">
            <label>Logo Tengah (Opsional)</label>
            <input type="file" id="input-logo" accept="image/png, image/jpeg, image/svg+xml" class="file-input">
            <span class="file-help">Biarkan kosong untuk menggunakan logo bawaan.</span>
        </div>
        
        <button id="btn-buat" onclick="buatQR()">Generate QR</button>
        
        <div id="canvas-container">
            <canvas id="qr-canvas" width="400" height="450"></canvas>
        </div>

        <div class="btn-group" id="grup-unduh">
            <select id="opsi-ukuran" aria-label="Pilih Ukuran Resolusi">
                <option value="400">Normal (400px)</option>
                <option value="720">HD (720px)</option>
                <option value="1080">Full HD (1080px)</option>
                <option value="2000">Cetak/Print (2000px)</option>
            </select>
            <button class="btn-outline" onclick="unduhGambar('png')">Unduh PNG</button>
            <button class="btn-outline" onclick="unduhGambar('svg')">Unduh SVG</button>
        </div>
    </div>

    <!-- Tempat Toast Notification -->
    <div id="toast" class="toast">Notifikasi</div>

    <script>
        const defaultLogoUrl = "https://lh3.googleusercontent.com/d/1RJkvv-OsdOchFl2L-oimzZpHAOzoPAZr";
        let currentQrSvgData = ""; 
        let currentLogoBase64 = "";

        // --- FUNGSI TOAST NOTIFICATION ---
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        // --- FITUR SHORTLINK ---
        async function shortenUrl() {
            const inputTeks = document.getElementById("input-teks");
            const url = inputTeks.value.trim();

            if (!url) {
                showToast("Mohon masukkan URL terlebih dahulu.");
                return;
            }

            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                showToast("Harap masukkan URL yang valid (dimulai dengan http:// atau https://).");
                return;
            }

            const btnShorten = document.getElementById("btn-shorten");
            btnShorten.disabled = true;
            btnShorten.style.opacity = "0.5";

            try {
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(url)}`);
                if (response.ok) {
                    inputTeks.value = await response.text();
                    showToast("URL berhasil diperpendek!");
                } else {
                    showToast("Gagal memperpendek URL. Coba beberapa saat lagi.");
                }
            } catch (error) {
                console.error("Error:", error);
                showToast("Terjadi kesalahan jaringan.");
            } finally {
                btnShorten.disabled = false;
                btnShorten.style.opacity = "1";
            }
        }

        // --- FITUR COPY TEKS ---
        function copyText() {
            const inputTeks = document.getElementById("input-teks");
            if (!inputTeks.value.trim()) {
                showToast("Tidak ada teks yang dapat disalin.");
                return;
            }

            navigator.clipboard.writeText(inputTeks.value).then(() => {
                const btn = document.getElementById("btn-copy");
                const originalContent = btn.innerHTML;
                
                // Ubah ikon sementara menjadi teks kecil
                btn.innerHTML = "<span style='font-size:11px; font-weight:700; color:#0e58a6;'>Copied</span>";
                showToast("Teks berhasil disalin!");
                
                setTimeout(() => { btn.innerHTML = originalContent; }, 2000);
            }).catch(() => {
                showToast("Browser tidak mendukung salin otomatis.");
            });
        }

        // --- FUNGSI UTAMA GENERATE QR ---
        function buatQR() {
            const teks = document.getElementById("input-teks").value;
            const judul = document.getElementById("input-judul").value;
            
            if (!teks) {
                showToast("Teks atau URL tidak boleh kosong.");
                return;
            }

            const canvas = document.getElementById("qr-canvas");
            const ctx = canvas.getContext("2d");

            // Reset Variabel untuk mencegah data nyangkut jika generate berkali-kali
            currentQrSvgData = "";
            currentLogoBase64 = "";

            // Pengaturan Skala Resolusi High-DPI
            const dpr = window.devicePixelRatio || 1;
            const rectWidth = 400;
            const rectHeight = 450;
            
            // Menyusun ulang kanvas membersihkan isi sebelumnya
            canvas.width = rectWidth * dpr;
            canvas.height = rectHeight * dpr;
            canvas.style.width = `${rectWidth}px`;
            canvas.style.height = `${rectHeight}px`;
            ctx.scale(dpr, dpr);

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";

            // Background & Judul Teks
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, rectWidth, rectHeight);

            ctx.fillStyle = "#111111";
            ctx.font = "bold 22px 'Inter', Arial, sans-serif";
            ctx.textAlign = "center";
            let teksJudul = judul.trim() === "" ? "QR Code" : judul;
            ctx.fillText(teksJudul, rectWidth / 2, 45); 

            // Generate Basis QR
            const tempCanvas = document.createElement("canvas");
            QRCode.toCanvas(tempCanvas, teks, {
                width: 360,
                margin: 1,
                color: { dark: "#000000", light: "#ffffff" },
                errorCorrectionLevel: 'H' 
            }, function (error) {
                if (error) { console.error(error); return; }
                
                ctx.drawImage(tempCanvas, 20, 65, 360, 360);

                // Buat versi SVG string (diperlukan untuk download bentuk vektor nantinya)
                QRCode.toString(teks, {
                    type: 'svg',
                    margin: 1,
                    color: { dark: "#000000", light: "#ffffff" },
                    errorCorrectionLevel: 'H'
                }, function (err, svgString) {
                    if (err) console.error(err);
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(svgString, "image/svg+xml");
                    const svgEl = doc.documentElement;
                    svgEl.setAttribute("width", "360");
                    svgEl.setAttribute("height", "360");
                    svgEl.setAttribute("x", "20");
                    svgEl.setAttribute("y", "65");
                    currentQrSvgData = svgEl.outerHTML;

                    // Fungsi Menambahkan Logo ke Canvas
                    const prosesGambarLogo = (sourceUrl, butuhCrossOrigin) => {
                        const img = new Image();
                        if (butuhCrossOrigin) img.crossOrigin = "Anonymous"; 
                        img.src = sourceUrl;
                        
                        // Sukses Load Logo
                        img.onload = function() {
                            // Konversi gambar logo menjadi base64 (untuk keperluan download SVG Vector)
                            const imgCanvas = document.createElement("canvas");
                            imgCanvas.width = img.width;
                            imgCanvas.height = img.height;
                            imgCanvas.getContext("2d").drawImage(img, 0, 0);
                            currentLogoBase64 = imgCanvas.toDataURL("image/png");

                            const logoSize = 80; 
                            const x = 20 + (360 / 2) - (logoSize / 2);
                            const y = 65 + (360 / 2) - (logoSize / 2);

                            // Background putih bulat di belakang logo
                            ctx.fillStyle = "#ffffff";
                            ctx.beginPath();
                            ctx.arc(x + logoSize/2, y + logoSize/2, (logoSize/2) + 6, 0, 2 * Math.PI);
                            ctx.fill();

                            // Gambar logo dengan kliping bulat
                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(x + logoSize/2, y + logoSize/2, logoSize/2, 0, Math.PI * 2, true);
                            ctx.closePath();
                            ctx.clip();
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = "high";
                            ctx.drawImage(img, x, y, logoSize, logoSize);
                            ctx.restore();

                            tampilkanWadahHasil();
                        };

                        // Fallback: Jika gagal muat (CORS / putus internet), tampilkan tanpa logo
                        img.onerror = function() {
                            console.warn("Logo gagal dimuat, menampilkan QR polosan.");
                            showToast("Info: Logo gagal dimuat, QR ditampilkan tanpa logo.");
                            tampilkanWadahHasil();
                        };
                    };

                    // Cek File Upload Logo Custom
                    const fileInput = document.getElementById("input-logo");
                    if (fileInput.files && fileInput.files[0]) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            prosesGambarLogo(e.target.result, false); // Base64 lokal, tidak butuh CORS
                        };
                        reader.readAsDataURL(fileInput.files[0]);
                    } else {
                        prosesGambarLogo(defaultLogoUrl, true); // Logo internet, butuh CORS
                    }
                });
            });
        }

        // Tampilkan Box Hasil & Tombol Unduh
        function tampilkanWadahHasil() {
            document.getElementById("canvas-container").style.display = "block";
            document.getElementById("grup-unduh").style.display = "flex";
        }

        // --- FUNGSI UNDUH (PNG & SVG) ---
        function unduhGambar(format) {
            const judulInput = document.getElementById("input-judul").value.trim();
            let namaFile = judulInput === "" ? "QR_Code" : judulInput;
            namaFile = namaFile.replace(/\s+/g, '_'); 

            const link = document.createElement("a");
            const targetWidth = parseInt(document.getElementById("opsi-ukuran").value);
            const targetHeight = targetWidth * (450 / 400); 

            if (format === 'png') {
                const canvasAsli = document.getElementById("qr-canvas");
                const tempCanvas = document.createElement("canvas");
                tempCanvas.width = targetWidth;
                tempCanvas.height = targetHeight;
                const tempCtx = tempCanvas.getContext("2d");

                tempCtx.imageSmoothingEnabled = true;
                tempCtx.imageSmoothingQuality = "high";
                tempCtx.drawImage(canvasAsli, 0, 0, targetWidth, targetHeight);

                link.download = `${namaFile}_${targetWidth}px.png`;
                link.href = tempCanvas.toDataURL("image/png");
            } 
            else if (format === 'svg') {
                let judulTeks = judulInput === "" ? "QR Code" : judulInput;
                
                // Jika logo gagal dimuat (currentLogoBase64 kosong), jangan panggil tag <image> SVG
                const imageTagSvg = currentLogoBase64 !== "" 
                    ? `<image href="${currentLogoBase64}" x="160" y="205" width="80" height="80" clip-path="url(#logo-clip)" preserveAspectRatio="xMidYMid slice" />` 
                    : "";
                
                const backgroundBulatSvg = currentLogoBase64 !== ""
                    ? `<circle cx="200" cy="245" r="46" fill="#ffffff" />
                       <clipPath id="logo-clip"><circle cx="200" cy="245" r="40" /></clipPath>`
                    : "";

                const svgLengkap = `
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="${targetWidth}" height="${targetHeight}">
                        <rect width="400" height="450" fill="#ffffff" />
                        <text x="200" y="45" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">${judulTeks}</text>
                        ${currentQrSvgData}
                        ${backgroundBulatSvg}
                        ${imageTagSvg}
                    </svg>
                `;

                const blob = new Blob([svgLengkap], { type: "image/svg+xml;charset=utf-8" });
                link.download = `${namaFile}_vector.svg`;
                link.href = URL.createObjectURL(blob);
            }

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(`Mendownload ${format.toUpperCase()} berhasil.`);
        }
    </script>
</body>
</html>
